name: iOS build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios.yml'
      - 'common/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/yarn.lock'
      - 'ios/**'
      - 'package.json'
      - 'react-native-safe-area-context.podspec'
      - 'react-native.config.js'
      - 'src/specs/**'
      - 'yarn.lock'
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'common/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/yarn.lock'
      - 'ios/**'
      - 'package.json'
      - 'react-native-safe-area-context.podspec'
      - 'react-native.config.js'
      - 'src/specs/**'
      - 'yarn.lock'
jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          working-directory: example
          bundler-cache: true
      - name: Install dependencies
        run: yarn install
      - name: Install example app dependencies
        run: yarn install
        working-directory: example
      - name: Validate podspec
        run: bundle exec pod lib lint ../react-native-safe-area-context.podspec --quick --allow-warnings --no-ansi
        working-directory: example
      - name: Install pods
        run: npx pod-install
        working-directory: example/ios
      - name: Build ios example app
        run: xcodebuild -scheme ReactTestApp -workspace RNSACExample.xcworkspace ONLY_ACTIVE_ARCH=NO -sdk iphonesimulator -configuration Debug
        working-directory: example/ios

  ios-compatibility:
    name: iOS compatibility (RN ${{ matrix.react-native }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-native: '0.82.0'
            react: '19.1.1'
          - react-native: '0.83.0'
            react: '19.2.0'
          - react-native: '0.84.0'
            react: '19.2.3'
          - react-native: '0.85.0'
            react: '19.2.3'
          - react-native: '0.86.0'
            react: '19.2.3'
          - react-native: '0.87.0'
            react: '19.2.3'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          working-directory: example
          bundler-cache: true
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            example/node_modules
          key: ${{ runner.os }}-ios-compat-rn-${{ matrix.react-native }}-${{ hashFiles('yarn.lock', 'example/yarn.lock') }}
      - name: Install dependencies
        run: yarn install
      - name: Prepare minimal app for RN ${{ matrix.react-native }}
        working-directory: example
        run: |
          npm pkg delete dependencies.@react-native-async-storage/async-storage
          npm pkg delete dependencies.react-native-gesture-handler
          npm pkg delete dependencies.react-native-screens
          yarn add --exact react@${{ matrix.react }} react-native@${{ matrix.react-native }}
      - name: Install pods
        working-directory: example/ios
        run: |
          rm -f Podfile.lock
          bundle exec pod install
      - name: Build iOS example app
        working-directory: example/ios
        run: |
          xcodebuild \
            -scheme ReactTestApp \
            -workspace RNSACExample.xcworkspace \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
