name: Android build

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/build-android.*'
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'common/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/yarn.lock'
      - 'package.json'
      - 'react-native.config.js'
      - 'src/specs/**'
      - 'yarn.lock'
  pull_request:
    paths:
      - '.github/scripts/build-android.*'
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'common/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/yarn.lock'
      - 'package.json'
      - 'react-native.config.js'
      - 'src/specs/**'
      - 'yarn.lock'

jobs:
  android-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore yarn workspaces
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install
      - name: Install example app dependencies
        run: yarn install
        working-directory: example
      - name: Build Android example app
        run: ./.github/scripts/build-android.sh

  android-compatibility:
    name: Android compatibility (RN ${{ matrix.react-native }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-native: '0.82.0'
            react: '19.1.1'
          - react-native: '0.83.0'
            react: '19.2.0'
          - react-native: '0.84.0'
            react: '19.2.3'
          - react-native: '0.85.0'
            react: '19.2.3'
          - react-native: '0.86.0'
            react: '19.2.3'
          - react-native: '0.87.0'
            react: '19.2.3'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            example/node_modules
          key: ${{ runner.os }}-compat-rn-${{ matrix.react-native }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install library dependencies
        run: yarn install
      - name: Prepare minimal compatibility app
        working-directory: example
        run: |
          npm pkg delete 'dependencies.@react-native-async-storage/async-storage'
          npm pkg delete 'dependencies.react-native-gesture-handler'
          npm pkg delete 'dependencies.react-native-screens'
          yarn add --exact "react@${{ matrix.react }}" "react-native@${{ matrix.react-native }}"
          cp node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
      - name: Build compatibility app
        working-directory: example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
