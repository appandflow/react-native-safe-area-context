apply plugin: "com.android.library"

def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlin = providers.gradleProperty("android.builtInKotlin").orNull
if (agpMajorVersion <= 8 || (builtInKotlin != null && !builtInKotlin.toBoolean())) {
    apply plugin: "kotlin-android"
}

android {
    namespace "com.safeareaexample.insetstest"
    compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.get("compileSdkVersion") : 36
    defaultConfig {
        minSdkVersion 24
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
}
